<div id="debug-console" style="display:none; position:fixed; bottom:0; left:0; width:100%; background:rgba(30, 0, 0, 0.95); color:#ff5555; font-family:monospace; font-size:12px; padding:12px; z-index:110000; box-sizing:border-box; max-height:200px; overflow-y:auto; border-top: 3px solid #ff0000; pointer-events: auto;">
  <button onclick="this.parentElement.style.display='none'" style="float:right; background:#ff4444; color:#fff; border:none; padding:4px 8px; cursor:pointer; font-weight:bold; border-radius:3px;">X</button>
  <div style="color:#aaa; text-transform:uppercase; font-size:10px; margin-bottom:8px; border-bottom:1px solid #444;">Javascript Debug Monitor</div>
  <div id="debug-msg"></div>
</div>
<script>
window.onerror = function(msg, url, lineNo, columnNo, error) {
  var debugConsole = document.getElementById('debug-console');
  var debugMsg = document.getElementById('debug-msg');
  if (debugConsole) debugConsole.style.display = 'block';
  if (debugMsg) {
    var div = document.createElement('div');
    div.style.cssText = "border-bottom:1px solid #555; padding:4px; margin-bottom:4px; line-height:1.4;";
    div.innerHTML = `<span style="color:#ffcc00">[Line ${lineNo}]</span> ${msg}`;
    debugMsg.appendChild(div);
  }
  return false;
};
</script>

<script>
(function() {
  // Target the new Back View ID instead of the old launcher
  var launcher = document.getElementById('back-view-root'); 
  var editor = document.getElementById('editor-container');

  // --- LONG PRESS LOGIC START ---
  var pressTimer, isEditorActive = false, startX=0, startY=0;

  window.addEventListener('pointerdown', function(e) {
    if (isEditorActive) return;
    startX = e.clientX; startY = e.clientY;
    pressTimer = setTimeout(function() {
      isEditorActive = true;
      launcher.style.display = 'none';
      editor.style.display = 'block';
      if (navigator.vibrate) navigator.vibrate(50);
      initEditor();

  });

  function clearTimer(){ if (pressTimer) clearTimeout(pressTimer); }
  window.addEventListener('pointerup', clearTimer);
  window.addEventListener('pointerleave', clearTimer);
  window.addEventListener('pointermove', function(e) {
    if (!pressTimer) return;
    var dx = Math.abs(e.clientX - startX);

  });
  // --- LONG PRESS LOGIC END ---

  function initEditor() {

      text:    { fill:"#4f4f4f", op:1.0, size:50, rot:0, bgOn:false, bg:"#FFCA28", bgOp:1.0, pad:10, isQuiz:false },
      draw:    { fill:"#FFCA28", fillOp:1.0, noFill:true, stroke:"#FFCA28", strokeOp:1.0, strokeW:6, rx:0, smooth:true, showStroke:true, connect:false, isQuiz:false },
      line:    { fill:"#ffffff", fillOp:1.0, noFill:true, stroke:"#FFCA28", strokeOp:1.0, strokeW:6, rx:0, smooth:true, showStroke:true, connect:false, isQuiz:false },
      square:  { fill:"#FFCA28", fillOp:1.0, noFill:false, stroke:"#000000", strokeOp:1.0, strokeW:2, rx:5, smooth:false, showStroke:true, connect:true, isQuiz:true },
      polygon: { fill:"#FFCA28", fillOp:1.0, noFill:false, stroke:"#000000", strokeOp:1.0, strokeW:2, rx:5, smooth:false, showStroke:true, connect:true, isQuiz:true },
      ref:     { opacity:1.0, radius:5, borderOn:false, border:"#FFCA28", borderOp:1.0, borderW:2, isQuiz:false }
    };

    var hexToRgb = (h) => { var r=/^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(h); return r?{r:parseInt(r[1],16),g:parseInt(r[2],16),b:parseInt(r[3],16)}:{r:0,g:0,b:0}; };
    var rgbToHex = (r, g, b) => "#" + ((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1);
    var hexWithOpacity = (h, o) => { if(!h||h==='none') return 'transparent'; var r=hexToRgb(h); return `rgba(${r.r},${r.g},${r.b},${o})`; };

    var appRoot = document.getElementById('app-root');
    var editorRoot = document.getElementById('editor-container') || document;
    var frontSourceEl = editorRoot.querySelector('#d-front') || document.getElementById('d-front');
    var frontContent = document.getElementById('editor-front-content');
    var areaTemplate = document.getElementById('game-area-template');
    var canvas = document.getElementById('sampler-canvas');

    var pickerPreview = document.getElementById('picker-preview');
    var pickerSwatch = document.getElementById('picker-swatch');
    var pickerHex = document.getElementById('picker-hex');

    var areas = [];
    var activeAreaIndex = 0;
    var wrapper = null;
    var imgStack = null;
    var refLayer = null;
    var overlay = null;
    var svgLayer = null;
    var textLayer = null;
    var gizmoLayer = null;

    var pts = [];
    var occlusions = [];
    var texts = [];
    var refs = [];

    // Buttons
    var btns = {
      view: document.getElementById('btn-view'),
      sel: document.getElementById('btn-sel'),
      pt: document.getElementById('btn-pt'),
      dr: document.getElementById('btn-dr'),
      ln: document.getElementById('btn-ln'),
      sq: document.getElementById('btn-sq'),
      poly: document.getElementById('btn-poly'),
      txt: document.getElementById('btn-txt'),
      del: document.getElementById('btn-del'),
      dup: document.getElementById('btn-dup'),
      crop: document.getElementById('btn-crop'),
      editTxt: document.getElementById('btn-edit-text'),
      quizType: document.getElementById('btn-type'),
      save: document.getElementById('btn-save')
    };

    // Menus
    var menuByTool = {
      point: document.getElementById('menu-point'),
      text: document.getElementById('menu-text'),
      draw: document.getElementById('menu-draw'),
      line: document.getElementById('menu-line'),
      square: document.getElementById('menu-square'),
      polygon: document.getElementById('menu-poly'),
      ref: document.getElementById('menu-ref')
    };

    function moveFrontContentIntoApp() {
      if (!frontContent || !appRoot) return;
      var templateHost = (areaTemplate && areaTemplate.parentNode) ? areaTemplate.parentNode : appRoot;
      if (frontContent.parentNode !== templateHost) {
        templateHost.insertBefore(frontContent, areaTemplate || templateHost.firstChild);
      }
    }

    function extractMarker(prevNode) {
      if (!prevNode || prevNode.nodeType !== Node.TEXT_NODE) return null;
      var text = prevNode.textContent;
      var match = text.match(/(\*{1,2})\s*$/);
      if (!match) return null;
      prevNode.textContent = text.slice(0, match.index);
      if (!prevNode.textContent.trim()) {
        prevNode.remove();
      }
      return match[1];
    }

    function createGameArea(baseImg) {
      if (!areaTemplate || !areaTemplate.content) return null;
      var wrapperEl = areaTemplate.content.firstElementChild.cloneNode(true);
      var imgStackEl = wrapperEl.querySelector('.img-stack');
      baseImg.classList.add('game-image');
      baseImg.style.width = '100%';
      baseImg.style.display = 'block';
      imgStackEl.appendChild(baseImg);
      return {
        wrapper: wrapperEl,
        imgStack: imgStackEl,
        refLayer: wrapperEl.querySelector('.ref-layer'),
        textLayer: wrapperEl.querySelector('.text-layer'),
        svgLayer: wrapperEl.querySelector('.svg-layer'),
        overlay: wrapperEl.querySelector('.label-overlay'),
        gizmoLayer: wrapperEl.querySelector('.gizmo-layer'),
        baseSrc: baseImg.src || '',
        objectImages: [],
        data: { points: [], occlusions: [], texts: [], refs: [] }
      };
    }

    function buildFrontLayout(html) {
      if (!frontContent) return [];
      var tmp = document.createElement('div');
      tmp.innerHTML = html || '';
      frontContent.innerHTML = '';
      var fragment = document.createDocumentFragment();
      var areaList = [];
      var lastArea = null;

      function flushFragment() {
        if (fragment.childNodes.length) {
          frontContent.appendChild(fragment);
          fragment = document.createDocumentFragment();
        }
      }

      Array.from(tmp.childNodes).forEach(node => {
        if (node.nodeType === Node.TEXT_NODE && !node.textContent.trim()) {
          return;
        }
        if (node.nodeType === Node.ELEMENT_NODE && node.tagName.toLowerCase() === 'img') {
          var marker = extractMarker(node.previousSibling);
          if (marker === '*') {
            flushFragment();
            var area = createGameArea(node);
            if (area) {
              areaList.push(area);
              lastArea = area;
              frontContent.appendChild(area.wrapper);
            }
            return;
          }
          if (marker === '**' && lastArea) {
            lastArea.objectImages.push(node);
            return;
          }
        }
        fragment.appendChild(node);
      });
      flushFragment();
      return areaList;
    }

    function setActiveArea(index) {
      if (!areas.length) return;
      activeAreaIndex = Math.max(0, Math.min(index, areas.length - 1));
      var area = areas[activeAreaIndex];
      wrapper = area.wrapper;
      imgStack = area.imgStack;
      refLayer = area.refLayer;
      textLayer = area.textLayer;
      svgLayer = area.svgLayer;
      overlay = area.overlay;
      gizmoLayer = area.gizmoLayer;
      pts = area.data.points;
      occlusions = area.data.occlusions;
      texts = area.data.texts;
      refs = area.data.refs;
    }
    function hideAllMenus(){
      Object.values(menuByTool).forEach(m => { if(m) m.style.display = 'none'; });
      _ctxOpen = false;
    }

    // ============================================================
    // TOOLBAR EVENT SHIELD
    // ============================================================
    (function(){
      var shieldRoot = document.querySelector('.sticky-wrapper') || document.querySelector('.app-toolbar');
      if(!shieldRoot) return;
      function swallow(e){ e.stopPropagation(); }
      ['pointerdown','pointermove','pointerup','pointercancel','wheel','touchstart','touchmove','touchend','mousedown','mousemove','mouseup'].forEach(ev=>{
        shieldRoot.addEventListener(ev, swallow, true);
      });
      ['pointerenter','pointerleave','pointerover','pointerout'].forEach(ev=>{
        shieldRoot.addEventListener(ev, swallow, true);
      });
    })();


    // ============================================================
    // PER-TOOL PRESETS
    // ============================================================
    var toolStyle = JSON.parse(JSON.stringify(DEFAULT_STYLES));

    // ============================================================
    // LOAD SAVE DATA
    // ============================================================
    var saveEl = editorRoot.querySelector('#d-savecode') || document.getElementById('d-savecode');
    var rawSave = (saveEl && saveEl.innerText ? saveEl.innerText : "").replace(/^coords:/, '').trim();
    var loaded = {};
    if (rawSave) { try { loaded = JSON.parse(rawSave); } catch(e){} }

    function getImageKey(src) {
      if (!src) return '';
      var clean = src.split('/').pop() || src;
      try { return decodeURIComponent(clean); } catch (e) { return clean; }
    }

    function isLegacySave(obj) {
      return obj && (Array.isArray(obj.points) || Array.isArray(obj.occlusions) || Array.isArray(obj.texts) || Array.isArray(obj.refs));
    }

    function normalizeSaveEntry(entry) {
      return {
        points: (entry && entry.points) ? entry.points : [],
        occlusions: (entry && entry.occlusions) ? entry.occlusions : [],
        texts: (entry && entry.texts) ? entry.texts : [],
        refs: (entry && entry.refs) ? entry.refs : []
      };
    }

    function applyDefaults(targetData){
      var ptsLocal = targetData.points || [];
      var occlusionsLocal = targetData.occlusions || [];
      var textsLocal = targetData.texts || [];
      var refsLocal = targetData.refs || [];
      ptsLocal.forEach(p=>{
        if(p.isQuiz===undefined) p.isQuiz = toolStyle.point.isQuiz;
        if(p.size===undefined) p.size = toolStyle.point.size;
        if(p.borderW===undefined) p.borderW = toolStyle.point.borderW;
        if(p.borderRad===undefined) p.borderRad = toolStyle.point.rad;
        if(p.showNum===undefined) p.showNum = toolStyle.point.showNum;
        if(p.fillOpacity===undefined) p.fillOpacity = toolStyle.point.fillOp;
        if(p.strokeOpacity===undefined) p.strokeOpacity = toolStyle.point.borderOp;
        if(p.color===undefined) p.color = toolStyle.point.fill;
        if(p.borderColor===undefined) p.borderColor = toolStyle.point.border;
      });
      textsLocal.forEach(t=>{
        if(t.isQuiz===undefined) t.isQuiz = toolStyle.text.isQuiz;
        if(t.size===undefined) t.size = toolStyle.text.size;
        if(t.rot===undefined) t.rot = toolStyle.text.rot;
        if(t.bgOn===undefined) t.bgOn = toolStyle.text.bgOn;
        if(t.bgRad===undefined) t.bgRad = toolStyle.text.pad;
        if(t.bgOpacity===undefined) t.bgOpacity = toolStyle.text.bgOp;
        if(t.bgColor===undefined) t.bgColor = toolStyle.text.bg;
        if(t.color===undefined) t.color = toolStyle.text.fill;
        if(t.opacity===undefined) t.opacity = toolStyle.text.op;
        if(t.dotX===undefined) t.dotX = 0;
        if(t.dotY===undefined) t.dotY = 0;
      });
      occlusionsLocal.forEach(o=>{
        if(o.isQuiz===undefined) o.isQuiz = true;
        if(o.color===undefined) o.color = "#ffffff";
        if(o.fillOpacity===undefined) o.fillOpacity = 1.0;
        if(o.noFill===undefined) o.noFill = false;
        if(o.strokeColor===undefined) o.strokeColor = "#000000";
        if(o.strokeWidth===undefined) o.strokeWidth = 6;
        if(o.strokeOpacity===undefined) o.strokeOpacity = 1.0;
        if(o.rx===undefined) o.rx = 0;
        if(o.connectEnds===undefined) o.connectEnds = true;
        if(o.smooth===undefined) o.smooth = false;
      });
      refsLocal.forEach(r=>{
        if(r.isQuiz===undefined) r.isQuiz = true;
        if(r.w===undefined) r.w = 25;
        if(r.rot===undefined) r.rot = 0;
        if(r.opacity===undefined) r.opacity = toolStyle.ref.opacity;
        if(r.radius===undefined) r.radius = toolStyle.ref.radius;
        if(r.borderOn===undefined) r.borderOn = toolStyle.ref.borderOn;
        if(r.borderW===undefined) r.borderW = toolStyle.ref.borderW;
        if(r.borderOp===undefined) r.borderOp = toolStyle.ref.borderOp;
        if(r.borderC===undefined) r.borderC = toolStyle.ref.border;
        if(!r.crop) r.crop = {t:0,r:0,b:0,l:0};
        if(r.dotX===undefined) r.dotX = 0;
        if(r.dotY===undefined) r.dotY = 0;
      });
    }
    moveFrontContentIntoApp();
    var frontHtml = (frontSourceEl && frontSourceEl.innerHTML) ? frontSourceEl.innerHTML : '';
    areas = buildFrontLayout(frontHtml);

    var saveByImage = {};
    if (isLegacySave(loaded)) {
      saveByImage.__legacy__ = normalizeSaveEntry(loaded);
    } else if (loaded && typeof loaded === 'object') {
      saveByImage = loaded;
    }

    areas.forEach((area, index) => {
      var baseKey = getImageKey(area.baseSrc);
      var entry = saveByImage[area.baseSrc] || saveByImage[baseKey] || saveByImage.__legacy__ || null;
      area.data = normalizeSaveEntry(entry);
      applyDefaults(area.data);
      area.wrapper.dataset.areaIndex = index;
      area.objectImages.forEach(imgNode => {
        if(!imgNode || !imgNode.src) return;
        var exists = area.data.refs.some(r => r && r.src === imgNode.src);
        if (!exists) {
          area.data.refs.push({
            src: imgNode.src, x:50, y:50, w:25, rot:0, opacity:1,
            isQuiz:true, radius:0,
            borderOn:false, borderW:2, borderOp:1, borderC:'#000000',

          });

      });
    });

    setActiveArea(0);

    // ============================================================
    // STATE
    // ============================================================
    var mode = 'point';
    var selection = { type:null, index:-1 };
    var drag = null;
    var tempPoly = [];
    var tmpSvg = null;
    var isCropMode = false;

    // STYLUS DETECTION STATE
    var _hasStylus = false;

    // Picker mode 
    var pickerMode = null;
    var pickerRAF = 0;

    function getCoords(e){
      var r = wrapper.getBoundingClientRect();
      var cx = (e.touches ? e.touches[0].clientX : e.clientX);
      var cy = (e.touches ? e.touches[0].clientY : e.clientY);
      return { x:((cx-r.left)/r.width)*100, y:((cy-r.top)/r.height)*100, pxX:cx-r.left, pxY:cy-r.top };
    }

    function getPathData(points, isClosed, isSmooth, radius, W, H){
      var p = points.map(pp => ({x:(pp.x/100)*W, y:(pp.y/100)*H}));
      if(p.length<2) return "";
      var d="";
      if (isSmooth) {
        d = "M "+p[0].x.toFixed(1)+" "+p[0].y.toFixed(1);
        var loop=isClosed?p.concat([p[0],p[1]]):p;
        var end=isClosed?p.length:p.length-1;
        for(var i=0;i<end;i++) {
          var p0=loop[i===0?(isClosed?loop.length-3:0):i-1], p1=loop[i], p2=loop[i+1], p3=loop[i+2]||p2;
          var cp1x=p1.x+(p2.x-p0.x)/6, cp1y=p1.y+(p2.y-p0.y)/6, cp2x=p2.x-(p3.x-p1.x)/6, cp2y=p2.y-(p3.y-p1.y)/6;
          d+=` C ${cp1x.toFixed(1)} ${cp1y.toFixed(1)} ${cp2x.toFixed(1)} ${cp2y.toFixed(1)} ${p2.x.toFixed(1)} ${p2.y.toFixed(1)}`;
        }
      } else if (radius>0) {
        var len=p.length;
        for(var i=0;i<len;i++){
          if(!isClosed && (i===0||i===len-1)){

        if(type==='l') { h.style.left=c.l+'%'; h.style.top='50%'; h.style.cursor='ew-resize'; }
        if(type==='r') { h.style.left=(100-c.r)+'%'; h.style.top='50%'; h.style.cursor='ew-resize'; }
        if(type==='tl') { h.style.top=c.t+'%'; h.style.left=c.l+'%'; h.style.cursor='nwse-resize'; }
        if(type==='tr') { h.style.top=c.t+'%'; h.style.left=(100-c.r)+'%'; h.style.cursor='nesw-resize'; }
        if(type==='bl') { h.style.top=(100-c.b)+'%'; h.style.left=c.l+'%'; h.style.cursor='nesw-resize'; }
        if(type==='br') { h.style.top=(100-c.b)+'%'; h.style.left=(100-c.r)+'%'; h.style.cursor='nwse-resize'; }
        g.appendChild(h);
      }
      ['t','r','b','l','tl','tr','bl','br'].forEach(makeH);
      gizmoLayer.appendChild(g);
    }

    function renderActive(){
      svgLayer.innerHTML="";
      textLayer.innerHTML="";
      overlay.innerHTML="";
      refLayer.innerHTML="";
      gizmoLayer.innerHTML="";
      var W=wrapper.offsetWidth, H=wrapper.offsetHeight;
      var isInt=(mode==='select'||mode==='delete');
      var k = W / 800;
      if(k < 0.2) k = 0.2;

      // REFS
      refs.forEach((r,i)=>{
        var img=document.createElement('img');
        img.src=r.src;
        img.className='ref-img';
        img.style.position='absolute';
        img.style.left=r.x+'%'; img.style.top=r.y+'%'; img.style.width=r.w+'%';
        img.style.transform=`translate(-50%,-50%) rotate(${r.rot||0}deg)`;
        var baseOp = (r.opacity!==undefined ? r.opacity : 1);
        img.style.opacity = (r.isQuiz!==false) ? (baseOp*0.9) : baseOp;
        img.style.borderRadius = ((r.radius||0)*k) + 'px';
        if(r.borderOn){
          var bw=(r.borderW||2)*k;
          var bc=hexWithOpacity(r.borderC||'#000000', r.borderOp!==undefined?r.borderOp:1);
          img.style.border = `${bw}px solid ${bc}`;
          img.style.boxSizing = 'border-box';
        } else img.style.border='none';
        if(r.crop) img.style.clipPath = `inset(${r.crop.t}% ${r.crop.r}% ${r.crop.b}% ${r.crop.l}%)`;
        img.style.pointerEvents=isInt?'auto':'none';
        img.setAttribute('data-idx',i);
        refLayer.appendChild(img);

        var isSelected = (selection.type === 'ref' && selection.index === i);
        if (r.isQuiz && !isSelected) {
          var ratio = 1;
          var pre = imgStack.querySelector(`img[src*="${r.src.split('/').pop()}"]`);
          if(pre && pre.naturalWidth > 0) ratio = pre.naturalWidth / pre.naturalHeight;
          else if(img.naturalWidth > 0) ratio = img.naturalWidth / img.naturalHeight;
          var pxW = (r.w/100)*W;
          var pxH = pxW / ratio;
          var pDot = document.createElement('div');
          pDot.style.cssText = `position:absolute; left:${50+(r.dotX||0)}%; top:${50+(r.dotY||0)}%; width:10px; height:10px; background:#3498db; border:1px solid white; border-radius:50%; transform:translate(-50%,-50%); pointer-events:none;`;
          var dotContainer = document.createElement('div');
          dotContainer.style.cssText = `position:absolute; left:${r.x}%; top:${r.y}%; width:${pxW}px; height:${pxH}px; transform:translate(-50%,-50%) rotate(${r.rot||0}deg); pointer-events:none;`;
          dotContainer.appendChild(pDot);
          overlay.appendChild(dotContainer);
        }
      });

      // OCCLUSIONS
      occlusions.forEach((o,i)=>{
        var el=document.createElementNS("http://www.w3.org/2000/svg", o.type==='rect'?'rect':'path');
        var pxX=o.x/100*W, pxY=o.y/100*H, pxW=o.w/100*W, pxH=o.h/100*H;
        var cx=pxX+pxW/2, cy=pxY+pxH/2;
        var sW=(o.strokeWidth||6)*k;
        if(o.type==='rect'){
          el.setAttribute('x',pxX); el.setAttribute('y',pxY);
          el.setAttribute('width',pxW); el.setAttribute('height',pxH);
          if(o.rx) { el.setAttribute('rx', (o.rx/100*pxW)); el.setAttribute('ry', (o.rx/100*pxW)); }
          el.setAttribute('transform',`rotate(${o.rot||0},${cx},${cy})`);
        } else {
          if(o.points){
            var absPts=o.points.map(p=>({x:o.x+p.x,y:o.y+p.y}));
            el.setAttribute('d',getPathData(absPts, o.connectEnds, o.smooth, o.rx, W, H));
            el.setAttribute('transform',`rotate(${o.rot||0},${cx},${cy})`);
          }
        }
        var isQ = o.isQuiz !== false;
        el.setAttribute('fill', o.noFill?'none':o.color);
        el.setAttribute('fill-opacity', isQ ? (o.fillOpacity*0.9) : o.fillOpacity);
        el.setAttribute('stroke', o.strokeColor);
        el.setAttribute('stroke-width', sW);
        el.setAttribute('stroke-opacity', o.strokeOpacity);
        el.setAttribute('stroke-linecap','round');
        el.setAttribute('stroke-linejoin','round');
        el.setAttribute('class','occ-shape');
        el.setAttribute('data-idx',i);
        el.style.pointerEvents=isInt?'auto':'none';
        svgLayer.appendChild(el);
      });

      if((mode==='polygon'||mode==='line') && tempPoly.length>0){
        var st = toolStyle[mode];
        var dStr = getPathData(tempPoly, false, !!st.smooth, 0, W, H);
        var path = document.createElementNS("http://www.w3.org/2000/svg","path");
        path.setAttribute('d', dStr);
        path.setAttribute('stroke', (!st.showStroke) ? 'none' : st.stroke);
        path.setAttribute('stroke-opacity', st.strokeOp);
        path.setAttribute('stroke-width', st.strokeW * k);
        path.setAttribute('stroke-linecap','round');
        path.setAttribute('stroke-linejoin','round');
        path.setAttribute('fill', st.noFill ? 'none' : st.fill);
        path.setAttribute('fill-opacity', st.fillOp);
        svgLayer.appendChild(path);
        var handle = document.createElement('div');
        handle.className = 'img-dot';
        handle.style.position = 'absolute';
        handle.style.left = tempPoly[tempPoly.length-1].x+'%';
        handle.style.top = tempPoly[tempPoly.length-1].y+'%';
        handle.style.transform = 'translate(-50%, -50%)';
        handle.style.background = '#2ecc71';
        handle.style.width=(16*k)+'px'; handle.style.height=(16*k)+'px';
        handle.style.pointerEvents='auto';
        handle.onpointerdown = (e)=>{ e.stopPropagation(); if(mode==='polygon') finishPoly(true); else finishPoly(false); };
        overlay.appendChild(handle);
      }

      // TEXTS
      texts.forEach((t,i)=>{
        var d=document.createElement('div');
        d.className='img-text';
        d.innerText=t.text;
        d.style.left=t.x+'%'; d.style.top=t.y+'%';
        d.style.transform=`translate(-50%,-50%) rotate(${t.rot||0}deg)`;
        d.style.color=t.color;
        d.style.fontSize=(t.size*k)+'px';
        d.style.opacity=(t.opacity!==undefined?t.opacity:1);
        var isSelected = (selection.type === 'text' && selection.index === i);
        if(t.isQuiz!==false){
          d.style.outline="1px dashed rgba(52,152,219,0.5)";
          d.style.opacity="0.9";
          if(!isSelected) {
            var tDot = document.createElement('div');
            tDot.style.cssText = `position:absolute; left:${50+(t.dotX||0)}%; top:${50+(t.dotY||0)}%; width:8px; height:8px; background:#e67e22; border:1px solid white; transform:translate(-50%,-50%) rotate(45deg); pointer-events:none;`;
            d.appendChild(tDot);
          }
        }
        if(t.bgOn){
          d.style.backgroundColor = hexWithOpacity(t.bgColor, (t.bgOpacity!==undefined?t.bgOpacity:1));
          d.style.padding = ((t.bgRad||4)*k)+'px';
          d.style.borderRadius = ((t.bgRad||4)*k)+'px';
        }
        d.style.pointerEvents=isInt?'auto':'none';
        d.setAttribute('data-idx',i);
        textLayer.appendChild(d);
      });

      // POINTS
      var visiblePointCount = 0;
      pts.forEach((p,i)=>{
        var d=document.createElement('div');
        d.className='img-dot';
        if(p.showNum!==false) { visiblePointCount++; d.innerText = visiblePointCount; }
        d.style.left=p.x+'%'; d.style.top=p.y+'%';
        var sz=(p.size||24)*k;
        d.style.width=sz+'px'; d.style.height=sz+'px';
        d.style.fontSize=Math.max(8*k,sz*0.6)+'px';
        d.style.boxSizing='border-box'; d.style.borderStyle='solid';
        d.style.backgroundColor=hexWithOpacity(p.color, (p.fillOpacity!==undefined?p.fillOpacity:1));
        d.style.borderColor=hexWithOpacity(p.borderColor||'#000000', (p.strokeOpacity!==undefined?p.strokeOpacity:1));
        d.style.color=(p.borderColor||'#000000');
        d.style.borderWidth=((p.borderW!==undefined?p.borderW:3)*k)+'px';
        d.style.borderRadius=(p.borderRad!==undefined?p.borderRad:50)+'%';
        if(p.isQuiz!==false) d.style.opacity="0.9";
        d.style.pointerEvents=isInt?'auto':'none';
        d.setAttribute('data-idx',i);
        overlay.appendChild(d);
      });

      if(selection.index>-1 && mode==='select') {
        if(selection.type==='ref' && isCropMode) renderCropGizmo(W,H,k);
        else renderGizmo(W,H,k);
      }
    }

    function render(){
      if (!areas.length) return;
      var storedSelection = selection;
      var storedActive = activeAreaIndex;
      areas.forEach((area, idx) => {
        setActiveArea(idx);
        if (idx !== storedActive) {
          selection = { type: null, index: -1 };
        }
        renderActive();
      });
      setActiveArea(storedActive);
      selection = storedSelection;
      updateUI();
      maybeAutoSwitchMenu();
    }

    function finishPoly(closed){
      if(tempPoly.length<2) return;
      var toolKey = (mode==='polygon') ? 'polygon' : 'line';
      var o = normalizeShape(tempPoly,'path',toolKey,closed);
      if(o){ occlusions.push(o); selection={type:null,index:-1}; }
      tempPoly = [];
      render();
    }

    // ============================================================
    // POINTER HANDLERS
    // ============================================================
    function handleStart(e){
      if(e.target.closest('.app-toolbar')) return;
      var areaEl = e.target.closest('.app-viewport');
      if (!areaEl) return;
      var nextIndex = parseInt(areaEl.dataset.areaIndex || 0, 10);
      if (!Number.isNaN(nextIndex) && nextIndex !== activeAreaIndex) {
        selection = { type: null, index: -1 };
        isCropMode = false;
        setActiveArea(nextIndex);
      }

      // --- NEW STYLUS PRIORITY LOGIC ---
      // 1. Detect if this is a pen
      if (e.pointerType === 'pen') {
        _hasStylus = true;
      }
      // 2. If a stylus has EVER been detected, and this event is a finger (touch),
      //    AND we are trying to use a tool (anything other than view mode),
      //    then IGNORE this touch completely.
      if (_hasStylus && e.pointerType === 'touch' && mode !== 'view') {
        return;
      }
      // ---------------------------------

      if (mode === 'view') return;

      if (pickerMode) {
        var h = sampleColor(e);
        if (h) applyPickedColor(h);
        return;
      }

      e.preventDefault();
      var c=getCoords(e), W=wrapper.offsetWidth, H=wrapper.offsetHeight;

      // Crop handles
      if(isCropMode && e.target.classList.contains('crop-handle')) {
        var type = e.target.dataset.cropHandle;
        var it = refs[selection.index];
        if(!it.crop) it.crop = {t:0,r:0,b:0,l:0};
        var el = refLayer.querySelector(`[data-idx="${selection.index}"]`);
        drag = {
          mode:'crop', type:type, it:it,
          startX:c.pxX, startY:c.pxY,
          startCrop: {...it.crop},
          W:it.w/100*W, H:(el?el.offsetHeight:50)
        };
        return;
      }
      // Vertex drag
      if(e.target.classList.contains('gizmo-vertex')){
        var itV = occlusions[selection.index];
        var cx = (itV.x/100*W) + (itV.w/100*W)/2;
        var cy = (itV.y/100*H) + (itV.h/100*H)/2;
        drag = {
          mode:'vertex', it: itV, idx: parseInt(e.target.dataset.vertexIdx),
          cx: cx, cy: cy, rot: (itV.rot||0), W: W, H: H
        };
        return;
      }
      // Gizmo handles
      if(e.target.classList.contains('gizmo-handle')){
        var h=e.target.dataset.handle;
        var it = getSelectedItem();
        if(!it) return;
        var cx, cy;
        if(selection.type==='occ'){
          cx = it.x/100*W + it.w/100*W/2;
          cy = it.y/100*H + it.h/100*H/2;
        } else {
          cx = it.x/100*W;
          cy = it.y/100*H;
        }
        var gwPx = 0, ghPx = 50;
        if(selection.type==='ref'){
           var elRef = refLayer.querySelector(`[data-idx="${selection.index}"]`);
           gwPx = it.w/100*W;
           ghPx = elRef ? elRef.offsetHeight : (it.w/100*W); 
        } else if(selection.type==='text') {
           var elTxt = textLayer.querySelector(`[data-idx="${selection.index}"]`);
           gwPx = elTxt ? elTxt.offsetWidth+10 : 50;
           ghPx = elTxt ? elTxt.offsetHeight+10 : 50;
        }
        drag = {
          mode:h, it:it, sx:c.pxX, sy:c.pxY,
          ox:it.x, oy:it.y, ow:it.w||0, oh:it.h||0, or:it.rot||0,
          os:it.size||0, px:cx, py:cy,
          sa:Math.atan2(c.pxY-cy,c.pxX-cx),
          sd:Math.sqrt((c.pxX-cx)**2+(c.pxY-cy)**2),
          op:it.points?JSON.parse(JSON.stringify(it.points)):null,
          gw: gwPx, gh: ghPx
        };
        return;
      }

      // Hit test
      if(mode==='select'||mode==='delete'){
        var hit=null, el=document.elementFromPoint(e.clientX, e.clientY);
        while(el && el!==wrapper){
          if(el.dataset && el.dataset.idx !== undefined){
            var i=parseInt(el.dataset.idx);
            if(el.classList.contains('occ-shape')) hit={type:'occ',index:i};
            else if(el.classList.contains('img-text')) hit={type:'text',index:i};
            else if(el.classList.contains('img-dot')) hit={type:'point',index:i};
            else if(el.classList.contains('ref-img')) hit={type:'ref',index:i};
            break;
          }
          el=el.parentElement;
        }
        if(mode==='delete' && hit){
          if(hit.type==='occ') occlusions.splice(hit.index,1);
          else if(hit.type==='text') texts.splice(hit.index,1);
          else if(hit.type==='ref') refs.splice(hit.index,1);
          else pts.splice(hit.index,1);
          selection={type:null,index:-1};
          render();
          return;
        }
        if(hit){
          selection=hit;
          isCropMode = (selection.type==='ref') ? isCropMode : false;
          syncMenusFromState();
          render();
          if(!isCropMode) {
            var it2 = getSelectedItem();
            drag={mode:'move', it:it2, sx:c.pxX, sy:c.pxY, ox:it2.x, oy:it2.y};
          }
        } else {
          selection={type:null,index:-1};
          isCropMode=false;
          render();
        }
        return;
      }

      // Create
      if(mode==='point'){
        var t=prompt("Label (use \\n for line break):");
        if(t) {
          var st = toolStyle.point;
          pts.push({
            x:c.x, y:c.y, text:t.replace(/\\n/g,'\n'),
            color:st.fill, fillOpacity:st.fillOp,
            borderColor:st.border, strokeOpacity:st.borderOp,
            size:st.size, borderW:st.borderW, borderRad:st.rad,
            showNum:st.showNum, isQuiz:st.isQuiz
          });
        }
        selection={type:null,index:-1};
        render();
        return;
      }
      if(mode==='text'){
        var tt=prompt("Text (use \\n for line break):");
        if(tt){
          var stt = toolStyle.text;
          texts.push({
            x:c.x, y:c.y, text:tt.replace(/\\n/g,'\n'),
            color:stt.fill, size:stt.size, rot:stt.rot,
            bgColor:stt.bg, bgOpacity:stt.bgOp, bgOn:stt.bgOn, bgRad:stt.pad,
            opacity:stt.op, isQuiz:stt.isQuiz, dotX:0, dotY:0
          });
        }
        render();
        return;
      }
      if(mode==='polygon'||mode==='line'){
        tempPoly.push({x:c.x, y:c.y});
        render();
        return;
      }
      if(mode==='draw'||mode==='square'){
        drag = { mode:'create', type:mode, toolKey:mode, pts:[{x:c.x,y:c.y}] };
        return;
      }
    }

    function handleMove(e){
      if (pickerMode) {
        if(!pickerRAF){
          pickerRAF = requestAnimationFrame(() => {
            pickerRAF = 0;
            var hex = sampleColor(e);
            if(hex) setPickerPreview(e.clientX, e.clientY, hex);
            else setPickerPreview(e.clientX, e.clientY, "");
          });
        }
        return;
      }
      if(!drag) return;
      e.preventDefault();
      var c=getCoords(e);
      var W=wrapper.offsetWidth, H=wrapper.offsetHeight;

      if(drag.mode==='crop'){
        var rad = (drag.it.rot||0) * Math.PI / 180;
        var dx = c.pxX - drag.startX;
        var dy = c.pxY - drag.startY;
        var localDx = dx * Math.cos(rad) + dy * Math.sin(rad);
        var localDy = -dx * Math.sin(rad) + dy * Math.cos(rad);
        var pX = (localDx / drag.W) * 100;
        var pY = (localDy / drag.H) * 100;
        var s = drag.startCrop;
        var t = drag.type;
        if(t.includes('t')) drag.it.crop.t = Math.max(0, Math.min(100 - s.b - 5, s.t + pY));
        if(t.includes('b')) drag.it.crop.b = Math.max(0, Math.min(100 - s.t - 5, s.b - pY));
        if(t.includes('l')) drag.it.crop.l = Math.max(0, Math.min(100 - s.r - 5, s.l + pX));
        if(t.includes('r')) drag.it.crop.r = Math.max(0, Math.min(100 - s.l - 5, s.r - pX));
        render();
        return;
      }
      if(drag.mode==='move-dot'){
        var rad2 = -(drag.it.rot||0) * Math.PI / 180;
        var dx2 = c.pxX - drag.px, dy2 = c.pxY - drag.py;
        var lDx = dx2 * Math.cos(rad2) - dy2 * Math.sin(rad2);
        var lDy = dx2 * Math.sin(rad2) + dy2 * Math.cos(rad2);
        if(drag.gw > 0) drag.it.dotX = (lDx / drag.gw) * 100;
        if(drag.gh > 0) drag.it.dotY = (lDy / drag.gh) * 100;
        render();
        return;
      }
      if(drag.mode==='vertex'){
        var rad = -(drag.rot||0) * Math.PI / 180;
        var dx = c.pxX - drag.cx;
        var dy = c.pxY - drag.cy;
        var ldx = dx * Math.cos(rad) - dy * Math.sin(rad);
        var ldy = dx * Math.sin(rad) + dy * Math.cos(rad);
        var worldPxX = drag.cx + ldx;
        var worldPxY = drag.cy + ldy;
        var worldX = (worldPxX / drag.W) * 100;
        var worldY = (worldPxY / drag.H) * 100;
        drag.it.points[drag.idx].x = worldX - drag.it.x;
        drag.it.points[drag.idx].y = worldY - drag.it.y;
        render();
        return;
      }
      if(drag.mode==='create'){
        drag.pts.push({x:c.x, y:c.y});
        var k = W / 800; if(k<0.2)k=0.2;
        var st = toolStyle[drag.toolKey];
        if(!tmpSvg){
          tmpSvg=document.createElementNS("http://www.w3.org/2000/svg", drag.type==='square'?'rect':'path');
          tmpSvg.setAttribute('fill', st.noFill ? 'none' : st.fill);
          tmpSvg.setAttribute('fill-opacity', st.fillOp);
          tmpSvg.setAttribute('stroke', (!st.showStroke) ? 'none' : st.stroke);
          tmpSvg.setAttribute('stroke-opacity', st.strokeOp);
          tmpSvg.setAttribute('stroke-width', st.strokeW * k);
          tmpSvg.setAttribute('stroke-linecap','round');
          tmpSvg.setAttribute('stroke-linejoin','round');
          svgLayer.appendChild(tmpSvg);
        }
        if(drag.type==='square'){
          var p0=drag.pts[0];
          var w=(c.x-p0.x)/100*W;
          var h=(c.y-p0.y)/100*H;
          tmpSvg.setAttribute('x', (p0.x/100*W) + (w<0?w:0));
          tmpSvg.setAttribute('y', (p0.y/100*H) + (h<0?h:0));
          tmpSvg.setAttribute('width', Math.abs(w));
          tmpSvg.setAttribute('height', Math.abs(h));
        } else {
          var d = getPathData(drag.pts, false, !!st.smooth, 0, W, H);
          tmpSvg.setAttribute('d', d);
        }
        return;
      }
      if(drag.mode==='move'){
        drag.it.x = drag.ox + ((c.pxX-drag.sx)/W)*100;
        drag.it.y = drag.oy + ((c.pxY-drag.sy)/H)*100;
        render();
        return;
      }
      if(drag.mode==='rotate'){
        drag.it.rot = drag.or + (Math.atan2(c.pxY-drag.py,c.pxX-drag.px)-drag.sa)*(180/Math.PI);
        render();
        return;
      }
      if(drag.mode==='resize'){
        var cos=Math.cos(-drag.or*Math.PI/180), sin=Math.sin(-drag.or*Math.PI/180);
        var ddx=c.pxX-drag.sx, ddy=c.pxY-drag.sy;
        var ldx=ddx*cos-ddy*sin, ldy=ddx*sin+ddy*cos;
        if(selection.type==='occ' && drag.it.type==='rect'){
          drag.it.w=Math.max(1,drag.ow+ldx/W*100);
          drag.it.h=Math.max(1,drag.oh+ldy/H*100);
        } else if(selection.type==='text'||selection.type==='point'||selection.type==='ref'){
          var s=Math.sqrt((c.pxX-drag.px)**2+(c.pxY-drag.py)**2)/drag.sd;
          if(selection.type==='text') drag.it.size=Math.max(8,drag.os*s);
          else if(selection.type==='point') drag.it.size=Math.max(5,drag.os*s);
          else if(selection.type==='ref') drag.it.w=Math.max(1,drag.ow*s);
        } else {
          var ss=((drag.ow+ldx/W*100)/drag.ow + (drag.oh+ldy/H*100)/drag.oh)/2;
          if(ss<0.1) ss=0.1;
          drag.it.w=drag.ow*ss;
          drag.it.h=drag.oh*ss;
          if(drag.it.points) drag.it.points=drag.op.map(p=>({x:p.x*ss,y:p.y*ss}));
        }
        render();
        return;
      }
    }

    function handleEnd(){
      if(drag && drag.mode==='create'){
        if(tmpSvg){ tmpSvg.remove(); tmpSvg=null; }
        var toolKey = drag.type;
        var o = (drag.type==='square')
          ? normalizeShape([{x:drag.pts[0].x,y:drag.pts[0].y},{x:drag.pts[drag.pts.length-1].x,y:drag.pts[drag.pts.length-1].y}],'rect','square')
          : normalizeShape(drag.pts,'path','draw');
        if(o){ occlusions.push(o); selection={type:null,index:-1}; }
      }
      drag=null;
      render();
    }

    // ============================================================
    // BINDS
    // ============================================================
    function bindTool(btn, toolKey){
      btn.onclick = (e)=>{
        e.stopPropagation();
        if (toolKey==='view') { setMode('view'); selection={type:null,index:-1}; hideAllMenus(); return; }
        if (toolKey==='select') { setMode('select'); return; }
        if (toolKey==='delete') { setMode('delete'); return; }
        onToolButton(toolKey);
        if (mode === toolKey && menuByTool[toolKey]) {
          // toggled by onToolButton
        }
      };
    }
    bindTool(btns.view,'view');
    bindTool(btns.sel,'select');
    bindTool(btns.del,'delete');
    bindTool(btns.pt,'point');
    bindTool(btns.txt,'text');
    bindTool(btns.dr,'draw');
    bindTool(btns.ln,'line');
    bindTool(btns.sq,'square');
    bindTool(btns.poly,'polygon');

    btns.dup.onclick = (e)=>{
      e.stopPropagation();
      if(selection.index === -1) return;
      var items = (selection.type==='occ'?occlusions:(selection.type==='text'?texts:(selection.type==='ref'?refs:pts)));
      var newItem = JSON.parse(JSON.stringify(items[selection.index]));
      newItem.x += 2; newItem.y += 2;
      items.push(newItem);
      selection = {type: selection.type, index: items.length-1};
      render();
    };
    btns.crop.onclick = (e)=>{
      e.stopPropagation();
      if(selection.index>-1 && selection.type==='ref'){
        isCropMode = !isCropMode;
        render();
      }
    };
    btns.editTxt.onclick = (e)=>{
      e.stopPropagation();
      if(selection.index === -1) return;
      var it = (selection.type==='text') ? texts[selection.index] : (selection.type==='point' ? pts[selection.index] : null);
      if(!it) return;
      var nt = prompt("New value (use \\n for line break):", (it.text||"").replace(/\n/g,'\\n'));
      if(nt !== null) { it.text = nt.replace(/\\n/g,'\n'); render(); }
    };
    btns.quizType.onclick = (e)=>{
      e.stopPropagation();
      var it = getSelectedItem();
      if(it) it.isQuiz = (it.isQuiz===undefined) ? false : !it.isQuiz;
      else {
        if(toolStyle[mode] && toolStyle[mode].isQuiz !== undefined) toolStyle[mode].isQuiz = !toolStyle[mode].isQuiz;
      }
      render();
    };
    btns.save.onclick = (e)=>{
      e.stopPropagation();
      var saveData = {};
      areas.forEach(area => {
        var key = getImageKey(area.baseSrc);
        saveData[key] = {
          points: area.data.points,
          occlusions: area.data.occlusions,
          texts: area.data.texts,
          refs: area.data.refs
        };
      });
      var s = JSON.stringify(saveData);
      var t=document.createElement("textarea");
      t.value="coords:"+s;
      document.body.appendChild(t);
      t.select();
      document.execCommand('copy');
      document.body.removeChild(t);
      var old = btns.save.innerHTML;
      btns.save.innerText="Copied!";
      setTimeout(()=>{ btns.save.innerHTML = old; }, 1100);
    };

    function bindInput(id, toolKey, field, type){
      var el = document.getElementById(id);
      if(!el) return;
      el.addEventListener('input', function(e){
        var v;
        if (el.type==='checkbox') v = el.checked;
        else v = el.value;
        if (type==='num') v = !!v;
        if (id==='dr-smooth') v = el.checked;
        if (id==='ln-smooth') v = el.checked;
        if (id==='po-smooth') v = el.checked;
        applyMenuChange(toolKey, field, v);
      });
      el.addEventListener('pointerdown', ev => ev.stopPropagation());
    }
    bindInput('pt-fill','point','fill');
    bindInput('pt-border','point','border');
    bindInput('pt-op','point','op');
    bindInput('pt-size','point','size');
    bindInput('pt-bw','point','bw');
    bindInput('pt-rad','point','rad');
    bindInput('pt-num','point','num');
    bindInput('tx-fill','text','fill');
    bindInput('tx-bg','text','bg');
    bindInput('tx-op','text','op');
    bindInput('tx-size','text','size');
    bindInput('tx-bgop','text','bgop');
    bindInput('tx-pad','text','pad');
    bindInput('tx-bgOn','text','bgOn');
    bindInput('dr-fill','draw','fill');
    bindInput('dr-stroke','draw','stroke');
    bindInput('dr-fop','draw','fop');
    bindInput('dr-sop','draw','sop');
    bindInput('dr-sw','draw','sw');
    bindInput('dr-smooth','draw','smooth');
    bindInput('dr-nofill','draw','nofill');
    bindInput('dr-borderon','draw','borderon');
    bindInput('ln-fill','line','fill');
    bindInput('ln-stroke','line','stroke');
    bindInput('ln-fop','line','fop');
    bindInput('ln-sop','line','sop');
    bindInput('ln-sw','line','sw');
    bindInput('ln-rx','line','rx');
    bindInput('ln-nofill','line','nofill');
    bindInput('ln-borderon','line','borderon');
    bindInput('ln-smooth','line','smooth');
    bindInput('sq-fill','square','fill');
    bindInput('sq-stroke','square','stroke');
    bindInput('sq-fop','square','fop');
    bindInput('sq-sop','square','sop');
    bindInput('sq-sw','square','sw');
    bindInput('sq-rx','square','rx');
    bindInput('sq-nofill','square','nofill');
    bindInput('sq-borderon','square','borderon');
    bindInput('po-fill','polygon','fill');
    bindInput('po-stroke','polygon','stroke');
    bindInput('po-fop','polygon','fop');
    bindInput('po-sop','polygon','sop');
    bindInput('po-sw','polygon','sw');
    bindInput('po-rx','polygon','rx');
    bindInput('po-nofill','polygon','nofill');
    bindInput('po-borderon','polygon','borderon');
    bindInput('po-close','polygon','connect');
    bindInput('po-smooth','polygon','smooth');
    bindInput('rf-op','ref','op');
    bindInput('rf-rad','ref','rad');
    bindInput('rf-border','ref','border');
    bindInput('rf-bop','ref','bop');
    bindInput('rf-bw','ref','bw');
    bindInput('rf-on','ref','on');

    function selectionMenuKey(){
      if(selection.index < 0) return null;
      if(selection.type === 'point') return 'point';
      if(selection.type === 'text') return 'text';
      if(selection.type === 'occ') {
        if(mode === 'draw') return 'draw';
        if(mode === 'line') return 'line';
        if(mode === 'square') return 'square';
        if(mode === 'polygon') return 'polygon';
        return 'draw';
      }
      if(selection.type === 'ref') return 'ref';
      return null;
    }

    function maybeAutoSwitchMenu(){
      if (pickerMode) return;
      if (_ctxLock) return;
      var sig = (selection.type || "") + ":" + (selection.index ?? -1);
      if (sig !== _ctxSelSig) {
        _ctxSelSig = sig;
        _ctxUserHidden = false;
      }
      if (selection.index < 0) {
        if (_ctxAuto) {
          hideAllMenus();
          _ctxOpen = false;
          _ctxAuto = false;
        }
        return;
      }
      if (_ctxUserHidden) return;
      var k = selectionMenuKey();
      if (k) showMenuFor(k, true);
    }

    function wireToggleButton(btnId, inputId, onValue, offValue){
      var btn = document.getElementById(btnId);
      var inp = document.getElementById(inputId);
      if(!btn || !inp) return;
      function readState(){
        if(inp.type === 'checkbox') return !!inp.checked;
        return (inp.value === onValue);
      }
      function writeState(next){
        if(inp.type === 'checkbox') {
          inp.checked = next;
          inp.dispatchEvent(new Event('input', {bubbles:true}));
        } else {
          inp.value = next ? onValue : offValue;
          inp.dispatchEvent(new Event('input', {bubbles:true}));
        }
      }
      function sync(){
        btn.classList.toggle('active', readState());
      }
      btn.addEventListener('pointerdown', ev => ev.stopPropagation());
      btn.onclick = (e)=>{
        e.stopPropagation();
        writeState(!readState());
        sync();
      };
      sync();
      return sync;
    }

    var syncPtNum = wireToggleButton('pt-num-toggle', 'pt-num', null, null);
    var syncTxBgOn = wireToggleButton('tx-bgOn-toggle', 'tx-bgOn', null, null);
    var syncDrNoFill = wireToggleButton('dr-nofill-toggle', 'dr-nofill', null, null);
    var syncDrStroke = wireToggleButton('dr-borderon-toggle', 'dr-borderon', null, null);
    var syncDrSmooth = wireToggleButton('dr-smooth-toggle', 'dr-smooth', null, null);
    var syncLnNoFill = wireToggleButton('ln-nofill-toggle', 'ln-nofill', null, null);
    var syncLnStroke = wireToggleButton('ln-borderon-toggle', 'ln-borderon', null, null);
    var syncLnSmooth = wireToggleButton('ln-smooth-toggle', 'ln-smooth', null, null);
    var syncSqNoFill = wireToggleButton('sq-nofill-toggle', 'sq-nofill', null, null);
    var syncSqStroke = wireToggleButton('sq-borderon-toggle', 'sq-borderon', null, null);
    var syncPoNoFill = wireToggleButton('po-nofill-toggle', 'po-nofill', null, null);
    var syncPoStroke = wireToggleButton('po-borderon-toggle', 'po-borderon', null, null);
    var syncPoClose  = wireToggleButton('po-close-toggle', 'po-close', null, null);
    var syncPoSmooth = wireToggleButton('po-smooth-toggle', 'po-smooth', null, null);
    var syncRfOn = wireToggleButton('rf-borderon-toggle', 'rf-on', null, null);

    var _syncMenusFromStateOriginal = syncMenusFromState;
    syncMenusFromState = function(){
      _syncMenusFromStateOriginal();
      if(syncPtNum) syncPtNum();
      if(syncTxBgOn) syncTxBgOn();
      if(syncDrNoFill) syncDrNoFill();
      if(syncDrStroke) syncDrStroke();
      if(syncDrSmooth) syncDrSmooth();
      if(syncLnNoFill) syncLnNoFill();
      if(syncLnStroke) syncLnStroke();
      if(syncLnSmooth) syncLnSmooth();
      if(syncSqNoFill) syncSqNoFill();
      if(syncSqStroke) syncSqStroke();
      if(syncPoNoFill) syncPoNoFill();
      if(syncPoStroke) syncPoStroke();
      if(syncPoClose)  syncPoClose();
      if(syncPoSmooth) syncPoSmooth();
      if(syncRfOn) syncRfOn();
      maybeAutoSwitchMenu();
    };

    function bindPick(btnId, toolKey, target){
      var b = document.getElementById(btnId);
      if(!b) return;
      b.onclick = (e)=>{ e.stopPropagation(); startPicker(toolKey, target); };
    }
    bindPick('pt-pick-fill','point','fill');
    bindPick('pt-pick-border','point','border');
    bindPick('tx-pick-fill','text','fill');
    bindPick('tx-pick-bg','text','bg');
    bindPick('dr-pick-fill','draw','fill');
    bindPick('dr-pick-stroke','draw','stroke');
    bindPick('ln-pick-fill','line','fill');
    bindPick('ln-pick-stroke','line','stroke');
    bindPick('sq-pick-fill','square','fill');
    bindPick('sq-pick-stroke','square','stroke');
    bindPick('po-pick-fill','polygon','fill');
    bindPick('po-pick-stroke','polygon','stroke');
    bindPick('rf-pick-border','ref','border');

    var rfReset = document.getElementById('rf-reset-crop');
    if(rfReset) rfReset.onclick = (e)=>{
      e.stopPropagation();
      if(selection.index>-1 && selection.type==='ref'){
        refs[selection.index].crop = {t:0,r:0,b:0,l:0};
        render();
      }
    };

    // ============================================================
    // GLOBAL LISTENERS
    // ============================================================
    areas.forEach(area => {
      area.wrapper.addEventListener('pointerdown', handleStart);
    });
    window.addEventListener('pointermove', handleMove);
    window.addEventListener('pointerup', function(){
      hidePickerPreview();
      if(!pickerMode && wrapper) wrapper.style.cursor = '';
      handleEnd();
    });
    window.addEventListener('blur', hidePickerPreview);
    window.addEventListener('resize', render);

    hideAllMenus();
    syncMenusFromState();
    setTimeout(render, 80);
  }
})();
</script>

}
